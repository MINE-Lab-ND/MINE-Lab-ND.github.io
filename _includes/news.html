<div class="news-container">
  <h3><i class="fas fa-newspaper"></i> Latest News</h3>

  <div class="news-items">
{% for article in site.data.news limit:9 %}
    <div class="news-item">
      <span class="news-date">{{ article.date }}</span>
      <div class="news-headline">{{ article.headline | markdownify}}</div>
    </div>
{% endfor %}
  </div>

  <div class="text-right">
    <a href="{{ site.url }}{{ site.baseurl }}/allnews.html" class="btn btn-primary">
      <i class="fas fa-arrow-right"></i> View all news
    </a>
  </div>
    </div>
