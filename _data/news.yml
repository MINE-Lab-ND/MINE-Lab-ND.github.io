- date: Sep. 2025
  headline: "Congratulations to Yue Huang and Xiangqi Wang for their papers accepted by NeurIPS 2025!"

- date: Jul. 2025
  headline: "Congratulations to Yue Huang and our co-authors for winning the Best Paper Award at the KDD 2025 SciSoc LLM Workshop for our paper \"Evaluating Large Language Models with Psychometrics\", and the Best Paper Award at the ICML2025 Workshop on Data in Generative Models (DIG-BUG) for our paper \"Preference Leakage: A Contamination Problem in LLM-as-a-Judge\". Many thanks to all our collaborators for their valuable contributions."

- date: Jul. 2025
  headline: "Congratulations to Yue Huang, Kehan, Yili for their papers accepted at CIKM 2025 and COLM 2025!"

- date: May. 2025
  headline: "1) Congratulations to Yue Huang, Kehan, Yili, Tianyu, and Haomin for their recent publications at ICLR'25, IJCAI'25 and ACL'25! 2) Congratulations to Zhenwen, and Manal, your graduations bring the number of PhDs from our lab to 17!"

- date: Sep. 2024
  headline: 1) Three papers are accepted by NeurIPS 2024 (1 highlight and 2 poster). Congratulations to Kehan and Yue Huang. Four papers are accepted by EMNLP 2024. Congratulations to Yujun, Yue Huang, Ziyi and Tianyu. 2) We launch the IEEE CS North America Student Challenge 2024 today. Welcome to participate the competition on Inferring User Latent Preference from Conversations with LLM, and win the prize.

- date: May. 2024
  headline: "1) Congratulations to Ziyi! The 15th PhD graduated from our lab, with his thesis--Exploring Trustworthy Concerns in Computer Vision: From Deterministic To Generative Domains. 2) Two paper are accepted by ICML 2024, one paper is accepted by ACL 2024, two paper are accepted by KDD 2024, and one paper is accepted by IJCAI 2024. Congratulations to Yue Huang, Yujun, Taicheng, Zhenwen and Ziyi."

- date: Oct. 2023
  headline: Congratulations to Zhenwen! Two of his recent papers, focused on solving Math Word Problems, have been accepted for EMNLP 2023.

- date: Sep. 2023
  headline: "PI Dr. Zhang is awarded another NSF grant (1.5 million US dollars) for the research project of Exploiting Federal Data and Beyond: A Multi-modal Knowledge Network for Comprehensive Wildlife Management under Climate Change."